# Generated by xrmd from .env (`xrmd server init`, `xrmd server org add|remove`): do not edit, it is re-rendered.
# Start with: xrmd server up
services:

  xrmd-acme:
    image: ${XRMD_IMAGE:?set XRMD_IMAGE in .env}
    restart: unless-stopped
    user: "1654:1654"   # the image's APP_UID, owner of /var/lib/xrmd/files and /var/lib/xrmd/backups in the image
    volumes:
      # Blobs of file and image columns (Files__FileSystem__Root defaults to this path). Shared by every organization:
      # blob keys are prefixed by the database name.
      - files:/var/lib/xrmd/files
      # The Microsoft SDK installed by `xrmd sdk install --dir <this directory>` (XRMD_SDK_DIR in the image); read-only, never in the image.
      - ./sdk:/var/lib/xrmd/sdk:ro
      # Org backup/restore (Admin API): the files archive (.files.tar). The SQL Server .bak stays on the SQL Server host.
      - backups:/var/lib/xrmd/backups
    ports:
      # Loopback only by default. To expose: set XRMD_BIND=0.0.0.0 in .env.
      - "${XRMD_BIND:-127.0.0.1}:${ORG_ACME_PORT:?set ORG_ACME_PORT in .env}:5000"
    environment:
      # The external SQL Server of SQL_CONNECTION (which sets no database); the database is the organization.
      ConnectionStrings__Org: "${SQL_CONNECTION:?set SQL_CONNECTION in .env};Database=acme"
      Admin__FilesBackupDirectory: /var/lib/xrmd/backups
      # Where the external SQL Server writes and reads the .bak files, as a path on the SQL Server host (e.g. D:\Backups on Windows).
      Admin__BackupDirectory: ${SQL_BACKUP_DIRECTORY:-/var/opt/mssql/backup}
      Auth__Mode: ${AUTH_MODE:-Development}
      # Each organization has its own audience: a token of one organization is rejected by the others.
      # ORG_<ORG>_AUDIENCE (Entra: the API's Application ID URI) overrides the default, the organization's local URL.
      Auth__Audience: "${ORG_ACME_AUDIENCE:-http://localhost:${ORG_ACME_PORT:?set ORG_ACME_PORT in .env}/}"
      Auth__TenantId: ${AUTH_TENANT_ID:-}
      Auth__DevSigningKey: ${AUTH_DEV_SIGNING_KEY:-}
      # Web admin sign-in with Entra: the SPA app registration's client id and the API scope (see README, Web admin)
      Ui__Entra__ClientId: ${UI_ENTRA_CLIENT_ID:-}
      Ui__Entra__Scope: ${UI_ENTRA_SCOPE:-}
      Seed__OrgName: acme
      Seed__AdminObjectId: ${ORG_ACME_ADMIN_OBJECT_ID:?set ORG_ACME_ADMIN_OBJECT_ID (GUID) in .env}
      Seed__AdminName: ${SEED_ADMIN_NAME:-Administrator}
      Seed__BaseCurrency: ${SEED_BASE_CURRENCY:-}
      # File and image columns: empty = file-system store at /var/lib/xrmd/files; FILES_STORE=S3Compatible needs the FILES_S3_* values, FILES_STORE=AzureBlob the FILES_AZURE_* values
      Files__Store: ${FILES_STORE:-}
      Files__FileSystem__Root: ${FILES_ROOT:-}
      Files__S3__ServiceUrl: ${FILES_S3_SERVICE_URL:-}
      Files__S3__Bucket: ${FILES_S3_BUCKET:-}
      Files__S3__AccessKey: ${FILES_S3_ACCESS_KEY:-}
      Files__S3__SecretKey: ${FILES_S3_SECRET_KEY:-}
      Files__S3__Region: ${FILES_S3_REGION:-}
      Files__S3__ForcePathStyle: ${FILES_S3_FORCE_PATH_STYLE:-}
      Files__Azure__ConnectionString: ${FILES_AZURE_CONNECTION_STRING:-}
      Files__Azure__ServiceUri: ${FILES_AZURE_SERVICE_URI:-}
      Files__Azure__Container: ${FILES_AZURE_CONTAINER:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

