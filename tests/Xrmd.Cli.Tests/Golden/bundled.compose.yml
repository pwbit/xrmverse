# Generated by xrmd from .env (`xrmd server init`, `xrmd server org add|remove`): do not edit, it is re-rendered.
# Start with: xrmd server up
services:
  # One-shot: the named backups volume is created root-owned (0755) because the mssql image has no
  # /var/opt/mssql/backup, while SQL Server runs as the non-root mssql user (uid 10001). Without this chown
  # BACKUP DATABASE fails with "Operating system error 5 (Access is denied.)". The directory is also written by xrmd (uid
  # 1654, the aspnet image's APP_UID), which puts the .files.tar of an org backup beside the .bak: hence owner mssql, group 1654, mode 2770.
  backups-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 10001:1654 /var/opt/mssql/backup && chmod 2770 /var/opt/mssql/backup"]
    volumes:
      - backups:/var/opt/mssql/backup
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Back after a reboot or a Docker restart, like the organizations and the proxy; SQL Server gets time to shut down
    # cleanly (the default 10 s ends in SIGKILL, exit 137).
    restart: unless-stopped
    stop_grace_period: 60s
    platform: linux/amd64   # emulated on Apple Silicon
    environment:
      # Y only once you have accepted the SQL Server license terms (issue #16): `xrmd server up --accept-sql-server-eula`.
      ACCEPT_EULA: ${ACCEPT_EULA:?accept the SQL Server license terms with xrmd server up --accept-sql-server-eula}
      # The edition (or a product key) is chosen in .env, never left to the image's default (Developer, not licensed for production).
      MSSQL_PID: ${MSSQL_PID:?set MSSQL_PID in .env}
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
    depends_on:
      backups-init:
        condition: service_completed_successfully
    volumes:
      - mssql-data:/var/opt/mssql
      # Org backup/restore (Admin API) reads and writes here; the mssql image has no such directory
      # (backups-init makes the volume writable by SQL Server).
      - backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  xrmd-acme:
    image: ${XRMD_IMAGE:?set XRMD_IMAGE in .env}
    restart: unless-stopped
    user: "1654:1654"   # the image's APP_UID; the backups volume is group-writable for this gid (see backups-init)
    depends_on:
      sqlserver:
        condition: service_healthy
      backups-init:
        condition: service_completed_successfully
    volumes:
      # Blobs of file and image columns (Files__FileSystem__Root defaults to this path). Shared by every organization:
      # blob keys are prefixed by the database name.
      - files:/var/lib/xrmd/files
      # The Microsoft SDK installed by `xrmd sdk install --dir <this directory>` (XRMD_SDK_DIR in the image); read-only, never in the image.
      - ./sdk:/var/lib/xrmd/sdk:ro
      # Org backup/restore (Admin API): the files archive is written beside the SQL Server .bak, at the same path.
      - backups:/var/opt/mssql/backup
    ports:
      # Loopback only by default. To expose: set XRMD_BIND=0.0.0.0 in .env.
      - "${XRMD_BIND:-127.0.0.1}:${ORG_ACME_PORT:?set ORG_ACME_PORT in .env}:5000"
    environment:
      ConnectionStrings__Org: "Server=sqlserver;Database=acme;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Auth__Mode: ${AUTH_MODE:-Development}
      # Each organization has its own audience: a token of one organization is rejected by the others.
      # ORG_<ORG>_AUDIENCE (Entra: the API's Application ID URI) overrides the default, the organization's local URL.
      Auth__Audience: "${ORG_ACME_AUDIENCE:-http://localhost:${ORG_ACME_PORT:?set ORG_ACME_PORT in .env}/}"
      Auth__TenantId: ${AUTH_TENANT_ID:-}
      Auth__DevSigningKey: ${AUTH_DEV_SIGNING_KEY:-}
      # Web admin sign-in with Entra: the SPA app registration's client id and the API scope (see README, Web admin)
      Ui__Entra__ClientId: ${UI_ENTRA_CLIENT_ID:-}
      Ui__Entra__Scope: ${UI_ENTRA_SCOPE:-}
      Seed__OrgName: acme
      Seed__AdminObjectId: ${ORG_ACME_ADMIN_OBJECT_ID:?set ORG_ACME_ADMIN_OBJECT_ID (GUID) in .env}
      Seed__AdminName: ${SEED_ADMIN_NAME:-Administrator}
      Seed__BaseCurrency: ${SEED_BASE_CURRENCY:-}
      # File and image columns: empty = file-system store at /var/lib/xrmd/files; FILES_STORE=S3Compatible needs the FILES_S3_* values, FILES_STORE=AzureBlob the FILES_AZURE_* values
      Files__Store: ${FILES_STORE:-}
      Files__FileSystem__Root: ${FILES_ROOT:-}
      Files__S3__ServiceUrl: ${FILES_S3_SERVICE_URL:-}
      Files__S3__Bucket: ${FILES_S3_BUCKET:-}
      Files__S3__AccessKey: ${FILES_S3_ACCESS_KEY:-}
      Files__S3__SecretKey: ${FILES_S3_SECRET_KEY:-}
      Files__S3__Region: ${FILES_S3_REGION:-}
      Files__S3__ForcePathStyle: ${FILES_S3_FORCE_PATH_STYLE:-}
      Files__Azure__ConnectionString: ${FILES_AZURE_CONNECTION_STRING:-}
      Files__Azure__ServiceUri: ${FILES_AZURE_SERVICE_URI:-}
      Files__Azure__Container: ${FILES_AZURE_CONTAINER:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  xrmd-zenith:
    image: ${XRMD_IMAGE:?set XRMD_IMAGE in .env}
    restart: unless-stopped
    user: "1654:1654"   # the image's APP_UID; the backups volume is group-writable for this gid (see backups-init)
    depends_on:
      sqlserver:
        condition: service_healthy
      backups-init:
        condition: service_completed_successfully
    volumes:
      # Blobs of file and image columns (Files__FileSystem__Root defaults to this path). Shared by every organization:
      # blob keys are prefixed by the database name.
      - files:/var/lib/xrmd/files
      # The Microsoft SDK installed by `xrmd sdk install --dir <this directory>` (XRMD_SDK_DIR in the image); read-only, never in the image.
      - ./sdk:/var/lib/xrmd/sdk:ro
      # Org backup/restore (Admin API): the files archive is written beside the SQL Server .bak, at the same path.
      - backups:/var/opt/mssql/backup
    ports:
      # Loopback only by default. To expose: set XRMD_BIND=0.0.0.0 in .env.
      - "${XRMD_BIND:-127.0.0.1}:${ORG_ZENITH_PORT:?set ORG_ZENITH_PORT in .env}:5000"
    environment:
      ConnectionStrings__Org: "Server=sqlserver;Database=zenith;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Auth__Mode: ${AUTH_MODE:-Development}
      # Each organization has its own audience: a token of one organization is rejected by the others.
      # ORG_<ORG>_AUDIENCE (Entra: the API's Application ID URI) overrides the default, the organization's local URL.
      Auth__Audience: "${ORG_ZENITH_AUDIENCE:-http://localhost:${ORG_ZENITH_PORT:?set ORG_ZENITH_PORT in .env}/}"
      Auth__TenantId: ${AUTH_TENANT_ID:-}
      Auth__DevSigningKey: ${AUTH_DEV_SIGNING_KEY:-}
      # Web admin sign-in with Entra: the SPA app registration's client id and the API scope (see README, Web admin)
      Ui__Entra__ClientId: ${UI_ENTRA_CLIENT_ID:-}
      Ui__Entra__Scope: ${UI_ENTRA_SCOPE:-}
      Seed__OrgName: zenith
      Seed__AdminObjectId: ${ORG_ZENITH_ADMIN_OBJECT_ID:?set ORG_ZENITH_ADMIN_OBJECT_ID (GUID) in .env}
      Seed__AdminName: ${SEED_ADMIN_NAME:-Administrator}
      Seed__BaseCurrency: ${SEED_BASE_CURRENCY:-}
      # File and image columns: empty = file-system store at /var/lib/xrmd/files; FILES_STORE=S3Compatible needs the FILES_S3_* values, FILES_STORE=AzureBlob the FILES_AZURE_* values
      Files__Store: ${FILES_STORE:-}
      Files__FileSystem__Root: ${FILES_ROOT:-}
      Files__S3__ServiceUrl: ${FILES_S3_SERVICE_URL:-}
      Files__S3__Bucket: ${FILES_S3_BUCKET:-}
      Files__S3__AccessKey: ${FILES_S3_ACCESS_KEY:-}
      Files__S3__SecretKey: ${FILES_S3_SECRET_KEY:-}
      Files__S3__Region: ${FILES_S3_REGION:-}
      Files__S3__ForcePathStyle: ${FILES_S3_FORCE_PATH_STYLE:-}
      Files__Azure__ConnectionString: ${FILES_AZURE_CONNECTION_STRING:-}
      Files__Azure__ServiceUri: ${FILES_AZURE_SERVICE_URI:-}
      Files__Azure__Container: ${FILES_AZURE_CONTAINER:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  mssql-data:
  backups:
  files:
