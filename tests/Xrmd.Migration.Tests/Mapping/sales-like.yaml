# Test fixture: an invented map from Dataverse sales tables to a sample solution, used by the map reader, map set, archive
# writer and CLI tests. Source names stand on the source side only; targets are the sample solution's names or platform columns.
# `values` maps by value; the customer's own values (>= 100000000) go `byLabel`; `fallback` is used when neither applies
# (null = empty, counted in the report). xrmv_fullname is a formula column and is never a target.
version: 1
requires: { solution: XvMapSample, minVersion: 0.1.0.0 }

tables:
  - source: lead
    target: xrmv_lead
    columns:
      subject: xrmv_topic
      firstname: xrmv_firstname
      lastname: xrmv_lastname
      jobtitle: xrmv_jobtitle
      companyname: xrmv_companyname
      telephone1: xrmv_phone
      mobilephone: xrmv_mobile
      emailaddress1: xrmv_email
      websiteurl: xrmv_website
      address1_line1: xrmv_street
      address1_city: xrmv_city
      address1_postalcode: xrmv_postalcode
      address1_stateorprovince: xrmv_stateorprovince
      address1_country: xrmv_country
      # 1 Advertisement; 2 Employee referral, 3 External referral, 9 Word of mouth; 4 Partner; 5 Public relations, 10 Other;
      # 6 Seminar, 7 Trade show; 8 Web
      leadsourcecode:
        target: xrmv_source
        values: { 1: 100000003, 2: 100000001, 3: 100000001, 9: 100000001, 4: 100000004, 5: 100000006, 10: 100000006, 6: 100000002, 7: 100000002, 8: 100000000 }
        byLabel: true
        fallback: 100000006
      # 1 Hot, 2 Warm, 3 Cold; no fallback: a value outside these stays empty
      leadqualitycode:
        target: xrmv_rating
        values: { 1: 100000000, 2: 100000001, 3: 100000002 }
        byLabel: true
        fallback: null
      # Each standard industry goes to the nearest of our eight; by value, so that the base language does not matter
      industrycode:
        target: xrmv_industry
        values:
          1: 100000006
          6: 100000006
          7: 100000006
          9: 100000006
          21: 100000006
          4: 100000002
          16: 100000002
          20: 100000002
          5: 100000001
          10: 100000001
          13: 100000001
          14: 100000001
          22: 100000001
          25: 100000001
          32: 100000001
          33: 100000001
          11: 100000004
          12: 100000000
          17: 100000000
          18: 100000000
          24: 100000000
          27: 100000003
          31: 100000003
          2: 100000007
          3: 100000007
          8: 100000007
          15: 100000007
          19: 100000007
          23: 100000007
          26: 100000007
          28: 100000007
          29: 100000007
          30: 100000007
        byLabel: true
        fallback: 100000007
      estimatedamount: xrmv_estimatedvalue
      estimatedclosedate: xrmv_estimatedclosedate
      description: xrmv_description
      parentaccountid: xrmv_parentaccountid
      parentcontactid: xrmv_parentcontactid
      qualifyingopportunityid: xrmv_qualifiedopportunityid
    derived:
      xrmv_qualifiedon: { from: qualifyingopportunityid.createdon }
    state:
      - { from: [0, 1], to: [0, 1] }
      - { from: [0, 2], to: [0, 100000000] }
      - { from: [1, 3], to: [1, 2] }
      - { from: [2, 4], to: [1, 100000001] }
      - { from: [2, 5], to: [1, 100000002] }
      - { from: [2, 6], to: [1, 100000003] }
      - { from: [2, 7], to: [1, 100000004] }
    # Per source state: where a custom status reason with no label match goes (never Qualified)
    stateFallback: { 0: [0, 1], 1: [1, 2], 2: [1, 100000004] }
    customColumns: carry

  - source: opportunity
    target: xrmv_opportunity
    columns:
      name: xrmv_name
      customerid: xrmv_customerid
      parentcontactid: xrmv_contactid
      originatingleadid: xrmv_originatingleadid
      estimatedvalue: xrmv_estimatedvalue
      estimatedclosedate: xrmv_estimatedclosedate
      actualvalue: xrmv_actualvalue
      actualclosedate: xrmv_actualclosedate
      closeprobability: xrmv_probability
      # 1 Hot, 2 Warm, 3 Cold; no fallback
      opportunityratingcode:
        target: xrmv_rating
        values: { 1: 100000000, 2: 100000001, 3: 100000002 }
        byLabel: true
        fallback: null
      # 0 Qualify, 1 Develop, 2 Propose, 3 Close; no fallback
      salesstage:
        target: xrmv_pipelinephase
        values: { 0: 100000000, 1: 100000001, 2: 100000002, 3: 100000003 }
        byLabel: true
        fallback: null
      description: xrmv_description
    state:
      - { from: [0, 1], to: [0, 1] }
      - { from: [0, 2], to: [0, 100000000] }
      - { from: [1, 3], to: [1, 2] }
      - { from: [2, 4], to: [1, 100000001] }
      - { from: [2, 5], to: [1, 100000002] }
    stateFallback: { 0: [0, 1], 1: [1, 2], 2: [1, 100000001] }
    customColumns: carry

  - source: opportunityclose
    target: xrmv_opportunityclose
    columns:
      subject: subject
      description: description
      scheduledstart: scheduledstart
      scheduledend: scheduledend
      actualstart: actualstart
      opportunityid: regardingobjectid
      actualrevenue: xrmv_actualvalue
      actualend: xrmv_actualclosedate
      competitorid: xrmv_competitorid
    # The close record does not say won or lost: the opportunity it points to does (spec 7.3)
    derived:
      xrmv_outcome:
        from: opportunityid.statecode
        values: { 1: 100000000, 2: 100000001 }
        fallback: null
      xrmv_reason:
        from: opportunityid.statuscode
        values: { 3: 2, 4: 100000001, 5: 100000002 }
        fallback: null
    state:
      - { from: [0, 1], to: [0, 1] }
      - { from: [1, 2], to: [1, 2] }
      - { from: [2, 3], to: [2, 3] }
    customColumns: carry

  - source: competitor
    target: xrmv_competitor
    columns:
      name: xrmv_name
      strengths: xrmv_strengths
      weaknesses: xrmv_weaknesses
      reportedrevenue: xrmv_reportedrevenue
      websiteurl: xrmv_website
      address1_line1: xrmv_street
      address1_city: xrmv_city
      address1_country: xrmv_country
    state:
      - { from: [0, 1], to: [0, 1] }
      - { from: [1, 2], to: [1, 2] }
    customColumns: carry

  # account and contact exist in the target: columns only, no state, customer columns are not touched
  - source: account
    target: account
    columns:
      creditlimit: xrmv_creditlimit
      creditonhold: xrmv_creditonhold
      # 1 Net 30 -> Net 30, 4 Net 60 -> Net 60; 2 (2% 10 Net 30) and 3 (Net 45) have no counterpart: empty, counted
      paymenttermscode:
        target: xrmv_paymentterms
        values: { 1: 100000000, 4: 100000001 }
        byLabel: true
        fallback: null
      originatingleadid: xrmv_originatingleadid

  - source: contact
    target: contact
    columns:
      creditlimit: xrmv_creditlimit
      creditonhold: xrmv_creditonhold
      paymenttermscode:
        target: xrmv_paymentterms
        values: { 1: 100000000, 4: 100000001 }
        byLabel: true
        fallback: null
      originatingleadid: xrmv_originatingleadid

relationships:
  - { source: leadcompetitors, target: xrmv_lead_xrmv_competitor }
  - { source: opportunitycompetitors, target: xrmv_opportunity_xrmv_competitor }
