# gitleaks configuration: the default rules, plus the test vectors that look like secrets and are not.
# Used by the secret scan of the public export (.github/workflows/sync-public.yml).
[extend]
useDefault = true

[allowlist]
description = "Fixed development-token test vectors (no real key)"
regexes = ['''(test|vector)-signing-key-0123456789-abcdefghijklmnop''']
paths = ['''fixtures/ui/dev-token-vector\.json$''']
