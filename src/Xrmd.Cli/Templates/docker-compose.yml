# Generated by xrmd from .env (`xrmd server init`, `xrmd server org add|remove`): do not edit, it is re-rendered.
# Start with: xrmd server up
services:
#{{SQL_BEGIN}}
  # One-shot: the named backups volume is created root-owned (0755) because the mssql image has no
  # /var/opt/mssql/backup, while SQL Server runs as the non-root mssql user (uid 10001). Without this chown
  # BACKUP DATABASE fails with "Operating system error 5 (Access is denied.)". The directory is also written by xrmd (uid
  # 1654, the aspnet image's APP_UID), which puts the .files.tar of an org backup beside the .bak: hence owner mssql, group 1654, mode 2770.
  backups-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 10001:1654 /var/opt/mssql/backup && chmod 2770 /var/opt/mssql/backup"]
    volumes:
      - backups:/var/opt/mssql/backup
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Back after a reboot or a Docker restart, like the organizations and the proxy; SQL Server gets time to shut down
    # cleanly (the default 10 s ends in SIGKILL, exit 137).
    restart: unless-stopped
    stop_grace_period: 60s
    platform: linux/amd64   # emulated on Apple Silicon
    environment:
      # Y only once you have accepted the SQL Server license terms (issue #16): `xrmd server up --accept-sql-server-eula`.
      ACCEPT_EULA: ${ACCEPT_EULA:?accept the SQL Server license terms with xrmd server up --accept-sql-server-eula}
      # The edition (or a product key) is chosen in .env, never left to the image's default (Developer, not licensed for production).
      MSSQL_PID: ${MSSQL_PID:?set MSSQL_PID in .env}
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
    depends_on:
      backups-init:
        condition: service_completed_successfully
    volumes:
      - mssql-data:/var/opt/mssql
      # Org backup/restore (Admin API) reads and writes here; the mssql image has no such directory
      # (backups-init makes the volume writable by SQL Server).
      - backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
#{{SQL_END}}
#{{POSTGRES_BEGIN}}
  # PostgreSQL organizations (STORAGE_PROVIDER=PostgreSql): every organization is a database of this server, created by the
  # organization's service at its first start. POSTGRES_PASSWORD is applied when the pg-data volume is first set up.
  postgres:
    image: {{POSTGRES_IMAGE}}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
#{{POSTGRES_END}}
#{{IDP_BEGIN}}
  # One-shot (AUTH_MODE=Local): secrets/<org>/ holds the initial administrator password of each organization, written by
  # `xrmd server init` (files 0600, owned by the host user); each organization mounts only its own folder. The server runs as
  # uid 1654, so each org folder owned by the host user gets group 1654 and mode 2770 (no access for other users: nobody else can
  # plant a password file) and only the regular, unlinked files in it owned by the host user are chowned to 1654. Symlinks are
  # never followed. The host user stays the folders' owner and can replace files.
  secrets-init:
    image: ${XRMD_IMAGE:?set XRMD_IMAGE in .env}
    user: "0:0"
    entrypoint: ["sh", "-c", "owner=$$(stat -c %u /run/xrmd/secrets) && find -P /run/xrmd/secrets -mindepth 1 -maxdepth 1 -type d -user \"$$owner\" -exec chgrp 1654 {} + -exec chmod 2770 {} + && find -P /run/xrmd/secrets -mindepth 2 -maxdepth 2 -type f -links 1 -user \"$$owner\" -exec chown 1654:1654 {} +"]
    volumes:
      - ./secrets:/run/xrmd/secrets
    restart: "no"

#{{IDP_END}}
#{{TDS_BEGIN}}
  # The SQL (TDS) endpoint certificates (ORG_<ORG>_TDS_PORT). The server runs as uid 1654 and cannot read the certificates where
  # they are kept (Caddy's storage is root's, mode 0600; certs/ is the host user's, mode 0600). This service copies each
  # organization's pair into tds/<org>/<host>.crt|.key with group 1654 and mode 0640 (tds/<org>: group 1654, mode 0750), at
  # start and then every TDS_INTERVAL seconds; only regular, unlinked files are read and no symbolic link is followed.
  # TDS_ORGS: <org>=<host> pairs; TDS_PAIR: empty for Caddy's storage, else the pair certs/<name>.crt|.key.
  tds-certs:
    image: ${XRMD_IMAGE:?set XRMD_IMAGE in .env}
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    environment:
      TDS_ORGS: "{{TDS_ORGS}}"
      TDS_PAIR: "{{TDS_PAIR}}"
      TDS_INTERVAL: "{{TDS_INTERVAL}}"
    entrypoint:
      - bash
      - -c
      - |
{{TDS_SCRIPT}}
    volumes:
#{{TDSCADDY_BEGIN}}
      - caddy-data:/data:ro
#{{TDSCADDY_END}}
#{{TDSFILES_BEGIN}}
      - ./certs:/certs:ro
#{{TDSFILES_END}}
      - ./tds:/out

#{{TDS_END}}
#{{ORGS}}

volumes:
#{{SQL_BEGIN}}
  mssql-data:
#{{SQL_END}}
#{{POSTGRES_BEGIN}}
  pg-data:
#{{POSTGRES_END}}
  backups:
  files:
#{{CADDY_BEGIN}}
  caddy-data:

networks:
  # The proxy and the organizations it serves; the proxy has a fixed address in it (EDGE_SUBNET, .10).
  # The other containers get addresses from the upper half only (ip_range), so none can take the proxy's.
  edge:
    ipam:
      config:
        - subnet: {{EDGE_SUBNET}}
          ip_range: {{EDGE_IP_RANGE}}
#{{CADDY_END}}
