name: website

# Builds the xrmverse website (site/) from docs/*.md and the README's documentation index, and deploys it to GitHub Pages.
# Path-filtered and short (one ~30 s build job plus the deploy job) to keep the Actions budget low.
# Only the docs pages and images are published, so changes in other docs folders alone do not trigger a deploy.

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.md'
      - 'docs/images/**'
      - 'README.md'
      - 'site/**'
      - 'deploy/azure/azuredeploy.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # The public copy of the repository (eng/public-export) sets XRMVERSE_PUBLIC_MIRROR: the site is deployed from here only.
    if: vars.XRMVERSE_PUBLIC_MIRROR != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: node site/build.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
