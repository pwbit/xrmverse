# xrmd on PostgreSQL (plans 2.7a and 2.7b), for development: the counterpart of docker-compose.yml without SQL Server.
# Usage: cp docker/.env.example docker/.env  (edit it: POSTGRES_PASSWORD, AUTH_*, SEED_*), then
#   docker compose -f docker/docker-compose.postgres.yml --env-file docker/.env up --build
# SA_PASSWORD, MSSQL_PID and ACCEPT_EULA are not read: no SQL Server runs and no SQL Server license applies.
# A PostgreSQL organization has every feature of a SQL Server one; the differences are in docs/postgresql.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      # The password of the postgres user, applied when the pg-data volume is first set up.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  xrmd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "1654:1654"   # the image's APP_UID
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Blobs of file and image columns (Files__FileSystem__Root defaults to this path).
      - files:/var/lib/xrmd/files
      # The Microsoft SDK assemblies, installed with `xrmd sdk install` (default ~/.xrmd/sdk); never part of the image.
      - ${XRMD_SDK_HOST_DIR:-${HOME}/.xrmd/sdk}:/var/lib/xrmd/sdk:ro
      # `xrmd org backup` writes the .dump of pg_dump and the .files.tar here (Admin:BackupDirectory's default).
      - backups:/var/lib/xrmd/backups
      # SQL (TDS) endpoint, read-only (AUTH_MODE=Local: SQL logins of the local identity provider). Uncomment this line, the port
      # below and the Tds__* settings: ./tds holds a PEM certificate and its unencrypted key, readable by uid 1654 (e.g. group 1654,
      # mode 0640). TLS is required: inside the container the endpoint never runs without a certificate.
      # `xrmd server init --database postgresql --auth local --tds-port 5558` generates this wiring (and the certificate copies) for you.
      # - ./tds:/run/xrmd/tds:ro
    ports:
      # Loopback only by default. To expose: set XRMD_BIND=0.0.0.0 in docker/.env.
      - "${XRMD_BIND:-127.0.0.1}:5000:5000"
      # SQL (TDS) endpoint: TDS_PORT on XRMD_TDS_BIND (every address by default); clients connect to <host>,<port>.
      # - "${XRMD_TDS_BIND:-0.0.0.0}:${TDS_PORT:-5558}:5558"
    environment:
      # An Npgsql connection string; the database is created at startup if missing (see DatabaseBootstrapper).
      ConnectionStrings__Org: "Host=postgres;Database=xrmverse;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Storage__Provider: PostgreSql
      Auth__Mode: ${AUTH_MODE:-Development}   # Entra | Development | Local (the server's own identity provider; needs an https AUTH_AUDIENCE)
      Auth__Audience: ${AUTH_AUDIENCE:-http://localhost:5000/}
      # AUTH_MODE=Local: path (inside the container, e.g. a mounted file) of a one-shot file with the initial administrator's password; the server deletes it after use.
      # This file mounts no secrets folder: add a volume for it yourself (e.g. `- ./secrets:/run/xrmd/secrets` and IDP_INITIAL_ADMIN_PASSWORD_FILE=/run/xrmd/secrets/admin-password), readable by uid 1654.
      Idp__InitialAdminPasswordFile: ${IDP_INITIAL_ADMIN_PASSWORD_FILE:-}
      # SQL (TDS) endpoint (see the tds volume above): off while Tds__Port is not set.
      # Tds__Port: 5558
      # Tds__CertificatePath: /run/xrmd/tds/server.crt
      # Tds__PrivateKeyPath: /run/xrmd/tds/server.key
      Auth__TenantId: ${AUTH_TENANT_ID:-}
      Auth__DevSigningKey: ${AUTH_DEV_SIGNING_KEY:-}  # required (>= 32 chars) when AUTH_MODE=Development; the host refuses to start without it
      # Web admin sign-in with Entra: the SPA app registration's client id and the API scope (see README, Web admin)
      Ui__Entra__ClientId: ${UI_ENTRA_CLIENT_ID:-}
      Ui__Entra__Scope: ${UI_ENTRA_SCOPE:-}
      Seed__OrgName: ${SEED_ORG_NAME:-xrmd}
      Seed__AdminObjectId: ${SEED_ADMIN_OBJECT_ID:?set SEED_ADMIN_OBJECT_ID (GUID) in docker/.env}
      Seed__AdminName: ${SEED_ADMIN_NAME:-Administrator}
      Seed__BaseCurrency: ${SEED_BASE_CURRENCY:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pg-data:
  backups:
  files:
