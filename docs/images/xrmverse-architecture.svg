48B" stroke-width="2" marker-end="url(#a)"/><rect x="940" y="384" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/><text x="1040.0" y="407.0" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#1E293B">Security</text><text x="1040.0" y="428.0" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#475569">roles, BUs, teams</text><line x1="1040" y1="348" x2="1040" y2="380" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><line x1="1040" y1="448" x2="1040" y2="526" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="530" width="1080" height="86" rx="14" fill="#1E293B" stroke="#1E293B"/><text x="600" y="560" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">SQL Server</text><text x="600" y="586" text-anchor="middle" font-size="14" fill="#CBD5E1">meta.* schema (definitions)  ·  data.* schema (one table per entity)</text><text x="600" y="606" text-anchor="middle" font-size="13" fill="#94A3B8">1 environment = 1 organization = 1 database</text></svg>
